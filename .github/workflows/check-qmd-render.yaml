name: Check whether the files render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quantmod
            any::ggplot2
            any::scales
            any::data.table
            any::slurmR
            any::epiworldR

      - name: Render slides
        run: quarto render slides.qmd --to revealjs

      - name: Render report
        run: quarto render report.qmd --to html

      - name: Upload slides
        uses: actions/upload-artifact@v4
        with:
          name: slides
          if-no-files-found: error
          path: |
            slides.html
            slides_files/**

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          if-no-files-found: error
          path: |
            report.html
            report_files/**

